<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100DayFit - Connecting to Strava</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 400px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }
        p {
            color: #a0aec0;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FC4C02;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #fca5a5;
        }
        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #86efac;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 16px;
        }
        .manual-code {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.875rem;
            word-break: break-all;
            margin-top: 16px;
        }
        #status { display: none; }
        #loading { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="icon">🏃</div>
            <div class="spinner"></div>
            <h1>Connecting to Strava...</h1>
            <p>Please wait while we complete the connection.</p>
        </div>

        <div id="status"></div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');
            const scope = params.get('scope');

            const loading = document.getElementById('loading');
            const status = document.getElementById('status');

            function showStatus(html) {
                loading.style.display = 'none';
                status.style.display = 'block';
                status.innerHTML = html;
            }

            if (error) {
                // User denied authorization or other error
                showStatus(`
                    <div class="icon">❌</div>
                    <h1>Authorization Denied</h1>
                    <div class="error">
                        <p>${error === 'access_denied' ? 'You denied access to your Strava account.' : 'An error occurred: ' + error}</p>
                    </div>
                    <p style="margin-top: 24px;">You can close this window and try again from the app.</p>
                `);

                // Try to redirect back to app with error
                setTimeout(function() {
                    window.location.href = 'dayfit100://strava/callback?error=' + encodeURIComponent(error);
                }, 1000);

            } else if (code) {
                // Success - redirect back to app with the code
                const appURL = 'dayfit100://strava/callback?code=' + encodeURIComponent(code);

                // Try immediate redirect
                window.location.href = appURL;

                // Show success after a brief delay (in case redirect doesn't work)
                setTimeout(function() {
                    showStatus(`
                        <div class="icon">✅</div>
                        <h1>Connected!</h1>
                        <div class="success">
                            <p>Successfully connected to Strava!</p>
                        </div>
                        <p style="margin-top: 24px;">Redirecting back to 100DayFit...</p>
                        <a href="${appURL}" class="btn">Open 100DayFit</a>
                        <p style="margin-top: 24px; font-size: 0.875rem; color: #718096;">
                            If the app doesn't open automatically, tap the button above.
                        </p>
                    `);
                }, 1500);

            } else {
                // No code or error - shouldn't happen normally
                showStatus(`
                    <div class="icon">🤔</div>
                    <h1>Something went wrong</h1>
                    <div class="error">
                        <p>No authorization code was received from Strava.</p>
                    </div>
                    <p style="margin-top: 24px;">Please close this window and try connecting again from the app.</p>
                `);
            }
        })();
    </script>
</body>
</html>
